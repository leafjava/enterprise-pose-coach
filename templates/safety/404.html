<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · {{ app_name }}</title>
    <link rel="stylesheet" href="/static/safety/design-system.css">
    <link rel="stylesheet" href="/static/safety/console.css">
</head>
<body>

<main class="error-shell">
    <div class="error-card">
        <span class="error-code">404</span>
        <h1>页面不存在</h1>
        <p>请求的路径 <code>{{ path }}</code> 不在 {{ app_name }} 的路由表中。</p>
        <div class="error-actions">
            <a class="btn btn-primary" href="/">返回首页</a>
            <a class="btn btn-ghost" href="/events">查看事件中心</a>
        </div>
    </div>
</main>

</body>
</html>
